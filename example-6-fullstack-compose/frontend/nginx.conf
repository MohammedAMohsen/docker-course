# إعداد خادم الويب داخل حاوية الواجهة الأمامية
#
# هذا الخادم يقوم بعملين:
#   1) يقدّم ملفات موقع React الجاهزة (ناتج البناء في مجلد dist).
#   2) يمرّر طلبات الخلفية إلى حاوية Django (وهذا اسمه: Reverse Proxy).
#
# النتيجة: المتصفح يتعامل مع عنوان واحد فقط (localhost:3001)،
# فلا نحتاج إعدادات CORS بين الواجهة والخلفية.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # خادم الأسماء الداخلي في شبكات Docker.
    # هو الذي يحوّل اسم الخدمة (backend) إلى عنوان الحاوية.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # backend: اسم الخدمة في ملف compose، و 8000 هو المنفذ داخل الحاوية.
    # وضعنا العنوان في متغيّر حتى لا يفشل الخادم عند التشغيل إذا لم تجهز الخلفية بعد.
    set $django_backend backend:8000;

    # ملاحظة عن الترويسة Host:
    # نستخدم $http_host وليس $host، لأن الأولى تحتفظ بالمنفذ (localhost:3001).
    # بدون المنفذ يرفض Django نماذج لوحة الإدارة بخطأ:
    # Origin checking failed - http://localhost:3001 does not match any trusted origins.

    location /api/ {
        proxy_pass http://$django_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://$django_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://$django_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ملفات التنسيق الخاصة بلوحة الإدارة.
    # بدون هذا الجزء تظهر لوحة الإدارة على المنفذ 3001 بلا تنسيق،
    # لأن الطلب يقع في الجزء الأخير ويعود بصفحة index.html بدل ملف CSS.
    # تنبيه: خادم التطوير في Django يقدّم هذه الملفات فقط عندما يكون وضع DEBUG مفعّلاً.
    location /static/ {
        proxy_pass http://$django_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # أي مسار آخر يعود إلى index.html،
    # حتى يتولى React التنقل بين الصفحات داخل المتصفح.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
